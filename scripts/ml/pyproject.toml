[project]
name = "semantix-ml"
version = "0.1.0"
description = "Offline training pipeline for the local retrieval model (docs/specs/local-retrieval-model.md)"
requires-python = ">=3.11"
# Core stays stdlib-only: dataset building, metrics, gating, score-params
# fitting and the checkpoint registry run anywhere pytest runs.
dependencies = []

[project.optional-dependencies]
# Training/serving extras — dev machine only, never shipped.
train = [
    "sentence-transformers>=3.0",
    "torch>=2.3",
    "optimum[onnxruntime]>=1.21",
]
serve = [
    "onnxruntime>=1.18",
    "tokenizers>=0.19",
]
synth = [
    "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["semantix_ml"]
