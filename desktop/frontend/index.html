<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Semantix</title>
    <!-- Critical boot shell: paint useful branded state before the desktop
         bundle and full application stylesheet finish parsing. React replaces
         this tree only after styles.css is ready, so the app never flashes
         unstyled content. Keep these rules in sync with StartupSplash. -->
    <style>
      html,body,#root{width:100%;height:100%;margin:0}body{overflow:hidden;background:#ffffff;color:#242424;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.boot-shell{position:fixed;inset:0;display:grid;place-items:center;background:#ffffff}.boot-shell__card{display:flex;flex-direction:column;align-items:center;gap:12px}.boot-shell__mark{display:grid;place-items:center}.boot-shell__mark img{display:block;width:220px;height:auto}.boot-shell__name{font-size:25px;font-weight:550;letter-spacing:-.75px}.boot-shell__dots{display:flex;height:12px;align-items:center;gap:6px;margin-top:8px}.boot-shell__dots span{width:4px;height:4px;border-radius:50%;background:#777777;animation:boot-pulse 1s ease-in-out infinite}.boot-shell__dots span:nth-child(2){animation-delay:.14s}.boot-shell__dots span:nth-child(3){animation-delay:.28s}@keyframes boot-pulse{0%,100%{opacity:.35}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.boot-shell__dots span{animation:none;opacity:.75}}
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-shell" role="status" aria-label="Semantix is starting">
        <div class="boot-shell__card">
          <div class="boot-shell__mark" aria-hidden="true"><img src="/src/assets/site-wordmark.svg" alt="SEMANTIX" /></div>
          <div class="boot-shell__dots" aria-hidden="true"><span></span><span></span><span></span></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
