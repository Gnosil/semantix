# nfpm config for the Linux .deb package. scripts/desktop-build.sh's linux branch
# runs `nfpm package` after `wails build`, from the desktop/ dir (so the src paths
# below are relative to desktop/). Portable clients keep using the .tar.gz under
# platforms[]; this .deb is the native package channel (native_packages) and also
# remains a human-download artifact.
#
# $DEB_VERSION and $DEB_ARCH are exported by desktop-build.sh. DEB_VERSION follows
# Debian version ordering: stable X.Y.Z, prereleases as X.Y.Z~rc.N / X.Y.Z~canary.N
# so they sort below the matching stable package. DEB_ARCH is the Go arch name,
# which already matches Debian's (amd64, arm64).
name: "semantix-desktop"
arch: "${DEB_ARCH}"
platform: "linux"
version: "${DEB_VERSION}"
section: "utils"
priority: "optional"
maintainer: "esengine <esengine@users.noreply.github.com>"
description: |
  Semantix desktop — a Wails shell around the Go kernel.
vendor: "Semantix Contributors"
homepage: "https://github.com/Gnosil/semantix"
license: "MIT"
scripts:
  postinstall: ./build/linux/postinstall.sh
# Runtime libraries the WebKitGTK 4.1 build links against (-tags webkit2_41); apt
# pulls them in on install. These package names ship from Ubuntu 22.04 / Debian 12 on.
# pkexec is required for the in-app Polkit authorization update path.
depends:
  - libgtk-3-0
  - libwebkit2gtk-4.1-0
  - pkexec
contents:
  - src: ./build/bin/semantix-desktop
    dst: /usr/bin/semantix-desktop
    file_info:
      mode: 0755
  - src: ./build/bin/semantix-launcher
    dst: /usr/bin/semantix-launcher
    file_info:
      mode: 0755
  - src: ./build/bin/semantix
    dst: /usr/bin/semantix
    file_info:
      mode: 0755
  - src: ./build/bin/semantix-update-helper
    dst: /usr/lib/semantix/semantix-update-helper
    file_info:
      mode: 0755
  - src: ./build/linux/io.semantix.desktop.update.policy
    dst: /usr/share/polkit-1/actions/io.semantix.desktop.update.policy
    file_info:
      mode: 0644
  - src: ./build/linux/semantix.desktop
    dst: /usr/share/applications/semantix.desktop
    file_info:
      mode: 0644
  # appicon.png is 1024x1024 — not a standard hicolor size dir, so install it under
  # the size-agnostic pixmaps path that the .desktop's `Icon=semantix-desktop` finds.
  - src: ./build/appicon.png
    dst: /usr/share/pixmaps/semantix-desktop.png
    file_info:
      mode: 0644
  - src: ./build/linux/icons/hicolor/16x16/apps/semantix-desktop.png
    dst: /usr/share/icons/hicolor/16x16/apps/semantix-desktop.png
    file_info:
      mode: 0644
  - src: ./build/linux/icons/hicolor/24x24/apps/semantix-desktop.png
    dst: /usr/share/icons/hicolor/24x24/apps/semantix-desktop.png
    file_info:
      mode: 0644
  - src: ./build/linux/icons/hicolor/32x32/apps/semantix-desktop.png
    dst: /usr/share/icons/hicolor/32x32/apps/semantix-desktop.png
    file_info:
      mode: 0644
  - src: ./build/linux/icons/hicolor/48x48/apps/semantix-desktop.png
    dst: /usr/share/icons/hicolor/48x48/apps/semantix-desktop.png
    file_info:
      mode: 0644
  - src: ./build/linux/icons/hicolor/64x64/apps/semantix-desktop.png
    dst: /usr/share/icons/hicolor/64x64/apps/semantix-desktop.png
    file_info:
      mode: 0644
  - src: ./build/linux/icons/hicolor/128x128/apps/semantix-desktop.png
    dst: /usr/share/icons/hicolor/128x128/apps/semantix-desktop.png
    file_info:
      mode: 0644
  - src: ./build/linux/icons/hicolor/256x256/apps/semantix-desktop.png
    dst: /usr/share/icons/hicolor/256x256/apps/semantix-desktop.png
    file_info:
      mode: 0644
  - src: ./build/linux/icons/hicolor/512x512/apps/semantix-desktop.png
    dst: /usr/share/icons/hicolor/512x512/apps/semantix-desktop.png
    file_info:
      mode: 0644
  - src: ./build/linux/icons/hicolor/scalable/apps/semantix-desktop.svg
    dst: /usr/share/icons/hicolor/scalable/apps/semantix-desktop.svg
    file_info:
      mode: 0644
