# semantix.example.toml — 示例配置（复制为 semantix.toml 后按需修改）
# 当前版本：CLI 参数优先于配置文件；此文件为团队约定与文档用途。

[project]
name = "my-project"          # 项目 slug（切片 scope=project 的聚合键）

[store]
# 不设置 db 时按 scope 选库：project/session → .semantix/project.db，user → ~/.semantix/user.db。
# 显式设置后，所有作用域都使用此库；全局配置建议使用绝对路径或 ~/ 路径。
# db = "~/.semantix/shared.db"
scope = "project"           # 默认切片作用域：session | project | user
max_slices = 5000           # 库条目上限（超限按价值评分归档到 <db>.archive.jsonl；0 = 不限）

[score]                     # 价值评分（gc / gateway 启动时批算，决定淘汰序）
half_life_days = 30         # 时效半衰期：30 天不用价值减半
grace_days = 7              # 新切片保护窗：淘汰序中排最后（不豁免上限）

[retrieval]
retriever = "hybrid"        # bm25 | vector | hybrid（RRF 融合）
limit = 5                   # search 默认 top-k
vector_dim = 256            # HashEmbedder 维度（模型级 Embedder 接入后忽略）
# Grey-zone 四阈值（Issue #259 阶段 1）：缺省 = kernel/zone 内置默认；
# CLI --tau-*/--abs-* flag 优先于此处的值。
tau_high = 0.8              # 相对置信：明确 hit 下界 (0,1]
tau_low = 0.55              # 相对置信：grey 下界 (0,1]，须 < tau_high
abs_high = 0.7              # 绝对分：明确 hit 地板（>= 0）
abs_low = 0.45              # 绝对分：grey 地板（>= 0）
# evolve_db 为 `usage --evolve-db` 输出的状态目录：其 tuned tau_l2 在
# 未显式配置 tau_low 时驱动 grey 下界（clamp 到 [0.30, 0.80]）。
# evolve_db = ".semantix/evolve"

# 按切片类型分化（Issue #259 阶段 2）：只写要改的字段，未写字段继承
# 全局阈值；类型名限 prompt|context|tool_pattern|result|memory。
# [retrieval.by_type.result]   # R 切片直接回答用户 → 更严
# tau_high = 0.85
# tau_low = 0.60
# [retrieval.by_type.context]  # C/P 仅做上下文 → 可放宽
# tau_low = 0.50

# 逐条目自适应（Issue #259 阶段 3，vCache 路线）：每个高频复用切片
# 从正/误命中反馈在线学习自己的 tau_low；全局阈值作先验/冷启动。
adaptive = true             # 开关（缺省 true；false = 全部用全局阈值）
error_bound = 0.05          # 条目级误命中率上界（-1 关闭自适应）
# adapt_db = ".semantix/l3-adapt.json"   # 状态文件（缺省 <db 同目录>/l3-adapt.json）

[inject]
budget = 4096               # L2 注入块最大字节数（整切片截断）
top_k = 5                   # 注入候选切片数

[verify]
holdout = 0.3               # 离线回放验证：后 30% 会话作为测试流
target_hit_rate = 0.7       # M0-2 验收目标命中率

[cost]                      # 成本对比参数（scripts/demo/cross-session.sh 同步）
tool_tokens = 300           # 每工具调用输出 token 估算
reuse_ratio = 0.8           # 注入替代重复步骤比例
input_price_usd = 0.27      # 每 1M 输入 token（cache miss）
cache_price_usd = 0.07      # 每 1M 输入 token（cache hit）
output_price_usd = 1.10     # 每 1M 输出 token

# Per-endpoint 价目覆盖（GLM-P0-4 #292）：`semantix usage` 的 per-provider
# 命中节省按端点价目计算，键名 = usage 事件的 provider 字段；缺省回退上面的全局价。
# [cost.providers.tokenhub-glm]
# input_price_usd = 1.12    # TokenHub GLM-5.3 ¥8/M ≈ $1.12
# cache_price_usd = 0.28    # 缓存命中 ¥2/M ≈ $0.28（折扣率 0.75）
# output_price_usd = 3.92   # ¥28/M ≈ $3.92

[doctor]                    # doctor 可选网络检查（GLM-P0-4 #292）；不配置 = 跳过、doctor 保持离线
# models_url = "https://tokenhub.tencentmaas.com/v1/models"   # 型号目录端点（需要时配 SEMANTIX_MODELS_API_KEY）
# watch_models = "glm-5.3,glm-5-turbo,deepseek-v4-flash"      # tier 映射所依赖的型号；pre-offline/下线时 WARN
