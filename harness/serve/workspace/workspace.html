<!doctype html>
<html lang="zh-CN" data-ws-shell>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Semantix</title>
<link rel="stylesheet" href="/workspace/tokens.css?v=3">
<link rel="stylesheet" href="/workspace/layout.css?v=3">
</head>
<body>
<div class="ws-app">
  <aside id="ws-side" class="ws-side" aria-label="项目与会话导航">
    <div class="ws-brand" data-ws-brand><img class="ws-brand-logo" src="/assets/logo-wordmark.svg" width="136" height="32" alt="Semantix" draggable="false"></div>
    <button class="ws-new" type="button" data-ws-new-task title="创建并进入新会话"><svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M8 2.2v11.6M2.2 8h11.6"/><path d="M3.4 1.8h6.2l3 3v9.4H3.4z"/></svg><span>新建会话</span><kbd>Ctrl+N</kbd></button>
    <div class="ws-side-project"><span data-ws-side-project-name>读取项目…</span></div>
    <div class="ws-side-label"><span>会话</span><span>全部 <span class="ws-side-count" data-ws-session-count></span></span></div>
    <div class="ws-session-filters" data-ws-session-filters>
      <label class="ws-search"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="m10.4 10.4 3.2 3.2"/></svg><input data-ws-session-search type="search" placeholder="搜索会话" aria-label="搜索会话"><kbd>Ctrl+K</kbd></label>
      <select class="ws-filter" data-ws-session-project aria-label="按项目筛选"><option value="">全部项目</option></select>
      <select class="ws-filter" data-ws-session-status aria-label="按状态筛选"><option value="">全部状态</option><option value="running">运行中</option><option value="done">已完成</option><option value="recovered">待恢复</option><option value="empty">空会话</option></select>
    </div>
    <ul id="ws-task-list" class="ws-tasks" data-ws-task-list role="list"><li class="ws-tasks-note" data-ws-tasks-loading aria-busy="true">正在读取会话…</li></ul>
    <nav class="ws-side-footer" aria-label="辅助导航">
      <button type="button" data-ws-placeholder="记忆"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M8 2.1c2.9 0 5 2.1 5 4.8 0 3.8-2.7 5.7-5 7-2.3-1.3-5-3.2-5-7 0-2.7 2.1-4.8 5-4.8Z"/><path d="M5.7 7.5c.7-.7 1.3-.7 2 0s1.3.7 2 0"/></svg><span>记忆</span></button>
      <button type="button" data-ws-placeholder="MCP 与技能"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="2.4" y="2.4" width="4.5" height="4.5" rx="1"/><rect x="9.1" y="9.1" width="4.5" height="4.5" rx="1"/><path d="m6.9 4.6 2.2 2.2m0 2.4L6.9 11.4"/></svg><span>MCP 与技能</span></button>
      <button type="button" data-ws-placeholder="设置"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.7v2M8 12.3v2M1.7 8h2M12.3 8h2M3.6 3.6 5 5M11 11l1.4 1.4M12.4 3.6 11 5M5 11l-1.4 1.4"/></svg><span>设置</span></button>
    </nav>
  </aside>

  <main class="ws-main">
    <header class="ws-topbar">
      <div class="ws-topbar-left">
        <button class="ws-icon ws-side-toggle" type="button" data-ws-side-toggle aria-expanded="false" aria-controls="ws-side" aria-label="打开会话栏" title="打开会话栏"><svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12"/></svg></button>
        <div class="ws-topbar-identity" data-ws-project data-ws-state="loading" title="当前工作区"><strong>Semantix</strong><span><span data-ws-project-name>读取项目…</span><span class="ws-topbar-separator"> · </span><span class="ws-topbar-runtime">浏览器工作台</span></span></div>
      </div>
      <div class="ws-topbar-right">
        <button class="ws-icon" type="button" data-ws-collapse aria-expanded="false" aria-controls="ws-context" title="打开工作区面板"><svg width="17" height="17" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><rect x="2" y="2.5" width="12" height="11" rx="2"/><path d="M10 2.5v11M12.5 8H13"/></svg></button>
      </div>
    </header>
    <p class="ws-notice" data-ws-notice role="status" hidden></p>

    <div class="ws-body">
      <section class="ws-center" aria-label="Semantix 对话">
        <div class="ws-hero ws-demo" data-ws-demo>
          <div class="ws-hero-mark" aria-hidden="true"><svg viewBox="0 0 48 48" width="48" height="48" fill="none" stroke-linejoin="round"><rect x="4" y="4" width="40" height="40" rx="3" transform="rotate(45 24 24)" stroke="#2dd4a0" stroke-width="3"/><rect x="13" y="13" width="22" height="22" rx="2" transform="rotate(45 24 24)" stroke="#20262d" stroke-width="3"/><rect x="20" y="20" width="8" height="8" transform="rotate(45 24 24)" fill="#2dd4a0" stroke="#2dd4a0" stroke-width="2"/></svg></div>
          <h1>Semantix</h1><p>一个编码智能体，描述任务或直接开始对话。</p>
          <div class="ws-hero-hints" aria-hidden="true"><span><kbd>/</kbd> 命令</span><span><kbd>@</kbd> 引用文件</span><span><kbd>↵</kbd> 发送</span></div>
          <div class="ws-hero-suggestions"><button type="button" data-ws-suggestion="解释这个代码库的架构">解释这个代码库的架构</button><button type="button" data-ws-suggestion="总结最近的 git 改动">总结最近的 git 改动</button><button type="button" data-ws-suggestion="检查当前项目的构建状态">检查当前项目的构建状态</button></div>
        </div>
        <article class="ws-task-head" data-ws-task-head hidden><h1 data-ws-task-title>当前会话</h1><p class="ws-meta" data-ws-task-meta></p></article>
        <div class="ws-timeline" data-ws-timeline aria-live="polite" aria-label="Agent 工作流时间线"></div>
        <div class="ws-statusbar" data-ws-cache-status aria-live="polite" hidden><span class="ws-dot"></span><span data-ws-cache-status-text></span><span class="chev">›</span></div>
        <form class="composer" data-ws-composer>
          <span class="ws-composer-caret" aria-hidden="true">›</span><textarea data-ws-input placeholder="给 Semantix 发消息…（/ 命令 · @ 文件）" rows="2" aria-label="给 Semantix 发消息"></textarea>
          <div class="composer-row">
            <button class="perm-chip" data-ws-permission type="button" title="权限由服务端策略控制"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M8 1.5 13 3.4v3.4c0 3.1-2.1 5.9-5 7.7-2.9-1.3-5-4.6-5-7.7V3.4L8 1.5Z"/><path d="m5.7 7.9 1.6 1.6 3-3.2"/></svg><span data-ws-permission-label>每次确认</span><svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg></button>
            <span class="ws-spacer"></span>
            <button class="send-btn" data-ws-send type="submit" aria-label="发送" disabled><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M8 13V3M4 7l4-4 4 4"/></svg></button><button class="send-btn ws-cancel-btn" data-ws-cancel type="button" aria-label="中止当前任务" title="中止当前任务" hidden><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="4" y="4" width="8" height="8" rx="1"/></svg></button>
          </div>
        </form>
        <div class="ws-composer-meta" aria-label="当前会话信息">
          <span class="ws-composer-project"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><path d="M1.8 4.5c0-.8.7-1.5 1.5-1.5h3l1.5 1.8h5.4c.8 0 1.5.7 1.5 1.5v5.2c0 .8-.7 1.5-1.5 1.5H3.3a1.5 1.5 0 0 1-1.5-1.5V4.5Z"/></svg><span data-ws-composer-project>读取项目…</span></span>
          <span class="ws-menu"><button class="ws-context-chip" type="button" data-ws-branch aria-haspopup="listbox" aria-expanded="false" data-ws-state="loading" title="当前工作区分支"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true"><circle cx="4.5" cy="12.5" r="2"/><circle cx="4.5" cy="3.5" r="2"/><path d="M11.5 4H7a3 3 0 0 0 0 6h4a3 3 0 0 1 0 6H8"/></svg><span data-ws-branch-name>读取分支…</span><svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg></button><ul class="ws-pop" role="listbox" data-ws-branch-menu hidden></ul></span>
          <span class="ws-spacer"></span><span class="ws-menu"><button class="ws-model-chip" type="button" data-ws-model aria-haspopup="listbox" aria-expanded="false" data-ws-state="loading" title="当前模型"><span data-ws-model-name data-ws-composer-model>读取模型…</span><svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg></button><ul class="ws-pop" role="listbox" data-ws-model-menu hidden></ul></span>
          <span class="ws-menu"><button class="ws-effort-chip" type="button" data-ws-effort aria-haspopup="listbox" aria-expanded="false" data-ws-state="loading" title="推理强度"><span data-ws-effort-value>默认</span><svg width="10" height="10" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg></button><ul class="ws-pop" role="listbox" data-ws-effort-menu hidden></ul></span>
        </div>
        <div class="ws-status-line" aria-live="polite"><span class="ws-dot is-on"></span><span data-ws-runtime-status>就绪</span></div>
      </section>

      <aside id="ws-context" class="ws-context" aria-label="工作区面板" hidden>
        <nav class="ws-tabs" role="tablist" aria-label="工作区视图"><button id="ws-tab-files" class="ws-tab is-active" data-ws-tab="files" aria-controls="ws-panel-files" role="tab" aria-selected="true" type="button">文件</button><button id="ws-tab-diff" class="ws-tab" data-ws-tab="diff" aria-controls="ws-panel-diff" role="tab" aria-selected="false" type="button" tabindex="-1">Diff</button><button id="ws-tab-terminal" class="ws-tab" data-ws-tab="terminal" aria-controls="ws-panel-terminal" role="tab" aria-selected="false" type="button" tabindex="-1">终端</button><button id="ws-tab-review" class="ws-tab" data-ws-tab="review" aria-controls="ws-panel-review" role="tab" aria-selected="false" type="button" tabindex="-1">Review</button></nav>
        <section id="ws-panel-files" class="ws-context-panel is-active" data-ws-panel="files" role="tabpanel" aria-labelledby="ws-tab-files"><ul class="ws-tree" data-ws-tree><li class="ws-context-empty">读取工作区文件…</li></ul><div class="ws-filehead" data-ws-file-head hidden></div><div class="ws-diff" data-ws-context-diff><p class="ws-context-empty">执行文件变更后，Diff 会显示在这里。</p></div></section>
        <section id="ws-panel-diff" class="ws-context-panel" data-ws-panel="diff" role="tabpanel" aria-labelledby="ws-tab-diff" hidden><div class="ws-context-scroll" data-ws-diff-list><p class="ws-context-empty">收到变更后，Diff 会显示在这里。</p></div></section>
        <section id="ws-panel-terminal" class="ws-context-panel" data-ws-panel="terminal" role="tabpanel" aria-labelledby="ws-tab-terminal" hidden><div class="ws-context-scroll" data-ws-terminal-list><p class="ws-context-empty">执行命令后，终端输出会显示在这里。</p></div></section>
        <section id="ws-panel-review" class="ws-context-panel" data-ws-panel="review" role="tabpanel" aria-labelledby="ws-tab-review" hidden><div class="ws-context-scroll" data-ws-review-list><p class="ws-context-empty">暂无待审阅变更或权限请求。</p></div></section>
      </aside>
    </div>
    <button class="ws-side-scrim" type="button" data-ws-side-close aria-label="关闭会话栏"></button>
  </main>
</div>
<script src="/workspace/shell.js?v=3"></script>
</body>
</html>
