# Semantix Gateway 部署 —— New API + semantix-gateway 单机两服务（设计文档 §5）。
#
# 用法（三条命令）：
#   cp deploy/.env.example deploy/.env   # 填 SEMANTIX_GATEWAY_KEY / DEEPSEEK_API_KEY
#   cp deploy/semantix-gateway.toml.example deploy/semantix-gateway.toml
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# 可选 · Milvus 向量库（profile `milvus`，默认不启动）：
#   docker compose -f deploy/docker-compose.yml --profile milvus up -d
# 追加 milvus / etcd / minio 三个服务，供编排器（Dify / Langflow / n8n）做 RAG
# 检索，同时把 LLM 调用指向 semantix-gateway 获得 L2 注入 / L3 复用。
# 注意：semantix 自身的检索后端此刻不使用 Milvus（retriever 仍是 bm25|vector|
# hybrid），二者职责正交。接法与能力边界见 docs/integrations/milvus.md。
#
# 网络：semantix-gateway:8080 仅暴露给 New API（compose 内部网络），不发布到宿主机。
# 数据：new-api 用 bind mount（./data/new-api），gateway 用 named volume（首次挂载
#       自动继承镜像内 /data 的 65532 所有权，非 root 可写；若改用 bind mount
#       需自行 chown 65532:65532 宿主目录）。

services:
  new-api:
    image: calciumion/new-api
    restart: unless-stopped
    ports:
      - "3000:3000" # 公网入口；TLS 建议前置 nginx（设计文档 §5 可选）
    volumes:
      - ./data/new-api:/data # SQLite 持久化
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3

  semantix-gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      SEMANTIX_GATEWAY_KEY: ${SEMANTIX_GATEWAY_KEY:?set in .env or shell}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?set in .env or shell}
    volumes:
      - semantix-data:/data # 切片库 + 会话旁路持久化
      - ./semantix-gateway.toml:/etc/semantix-gateway.toml:ro
    expose:
      - "8080" # 仅 compose 内部网络
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/healthz | grep -q '\"status\":\"ok\"'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # 可选 · Milvus 向量库（profile `milvus`）
  #
  # 三个服务都带 `profiles: [milvus]`，因此默认的 `up -d` 不会启动它们——现有
  # 两服务部署行为一字不变。显式 `--profile milvus up -d` 才拉起。
  #
  # 安全（docs/Security-安全设计.md:172 / :221 / :228）：
  #   1. 仅回环可达 —— 三者都只用 expose，不发布到宿主机；
  #   2. 启用本地认证 —— Milvus 开鉴权（见 milvus-user.yaml），凭据走 .env；
  #   3. 运行时服务身份校验 —— compose 无法提供，属 MilvusIndex 连接路径的实现
  #      要求（L2 范围），此处未满足，见 docs/integrations/milvus.md 能力边界。
  # 版本全部钉定：Milvus 必须 >= 2.5（新版 Go SDK milvus/client/v2 的下限）。
  # ---------------------------------------------------------------------------
  milvus:
    image: milvusdb/milvus:v2.5.4
    profiles: [milvus]
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      # Milvus 以 <yaml 路径去掉点、全大写> 的形式接受配置覆盖，用于把 MinIO
      # 凭据从 .env 注入，避免写死在文件里（CONTRIBUTING.md:31）。
      MINIO_ACCESSKEYID: ${MINIO_ROOT_USER:?set in deploy/.env}
      MINIO_SECRETACCESSKEY: ${MINIO_ROOT_PASSWORD:?set in deploy/.env}
    volumes:
      - milvus-data:/var/lib/milvus
      # user.yaml 是 Milvus 的增量覆盖文件（milvus.yaml 的默认值仍生效），
      # 这里只用它打开鉴权，不整份替换默认配置。
      - ./milvus-user.yaml:/milvus/configs/user.yaml:ro
    expose:
      - "9091"  # /healthz，仅 compose 内部网络
    ports:
      # 显式绑定 127.0.0.1：MCP server（uvx mcp-server-milvus）是跑在宿主机上的
      # stdio 子进程，不在 compose 网络里，只靠 expose 连不上。绑回环既让它可
      # 达，又正是 Security-安全设计.md:172「仅绑定回环地址」要求的形态。
      # 切勿写成 "19530:19530" —— 那会绑到 0.0.0.0，把切片向量暴露到局域网。
      - "127.0.0.1:19530:19530"
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 90s # standalone 冷启动含索引节点初始化，留足窗口

  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    profiles: [milvus]
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - etcd-data:/etcd
    command:
      - etcd
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    expose:
      - "2379"
    healthcheck:
      # 必需：milvus 用 condition: service_healthy 等它，缺 healthcheck 会导致
      # Milvus 在 etcd 就绪前启动并反复重启。
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    profiles: [milvus]
    restart: unless-stopped
    environment:
      # 新版变量名；MINIO_ACCESS_KEY / MINIO_SECRET_KEY 已废弃。无默认值，
      # 未设置即启动失败，避免 minioadmin/minioadmin 这类弱口令进生产。
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in deploy/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in deploy/.env}
    volumes:
      - minio-data:/minio-data
    command: minio server /minio-data --address ":9000"
    expose:
      - "9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  semantix-data:
  milvus-data:
  etcd-data:
  minio-data:
