<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Semantix</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <header><span class="mark">◇</span><strong>SEMANTIX</strong><span class="beta">BETA</span></header>
    <section class="hero">
      <p class="eyebrow">WINDOWS CODING AGENT</p>
      <h1>从一个项目开始。</h1>
      <p class="intro">选择本地文件夹。这个窗口将只绑定该项目，任务、终端和修改都会留在同一个工作台中。</p>
      <button id="open">打开文件夹 <span>Ctrl+O</span></button>
      <p id="status" role="status"></p>
    </section>
    <section class="recent" hidden>
      <h2>最近项目</h2>
      <div id="projects"></div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
